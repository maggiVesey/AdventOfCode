<!DOCTYPE html>
<html>
<head>
<title>Advent of Code</title>
<style>
	div {
		font-family:monospace;
		font-size:100%;
	}
</style>
<script>
function drawGrid(grid) {
	let tableString = '<table>'
	for(let i=0;i<grid.length;i++) {
		tableString += '<tr>'
		for(let j=0;j<grid[i].length;j++) {
			tableString += '<td';
			tableString += ' id="td_'+i+'_'+j+'"';
			tableString += '>'
			tableString += grid[i][j]
			tableString += '</td>'
		}
		tableString += '</tr>'
	}
	tableString += '</table>'
	document.getElementById("grid").innerHTML = tableString;
}

function aocFunction(input) {

	const inputFile = input.files[0];
	const reader = new FileReader();

	reader.onload = (event) => {
		const file = event.target.result;

		const allLines = file.split(/\r\n|\n/);
		
		let result = 0
		
		const grid = Array.from({length:1000}, () => Array(1000).fill(0));

		allLines.forEach((line) => {
			const coords = line.match(/\d+/g).map(Number)
			
			for(let i=coords[0];i<=coords[2];i++) {
				for(let j=coords[1];j<=coords[3];j++) {
					if(line.startsWith('turn on')) {
						grid[i][j]++
					}
					if(line.startsWith('turn off')) {
						if(grid[i][j] > 0) {
							grid[i][j]--
						}
					}
					if(line.startsWith('toggle')) {
						grid[i][j] += 2
					}
				}
			}

		});
//		drawGrid(grid)
 		
		result = grid.flat().reduce((total, currentValue) => total + currentValue,0);
		document.getElementById('result').value = result;
	};

	reader.onerror = (event) => {
		alert(event.target.error.name);
	};

	reader.readAsText(inputFile);
}

window.onload = function() {
	document.getElementById('file').addEventListener('change',function() {
		aocFunction(this)
	})
}

</script>
</head>
<body>
	<input type="file" name="file" id="file" accept=".txt">
	<hr />
	<label for="result">Result</label>
	<textarea id="result"></textarea>
	<div id="grid"></div>
</body>
</html>
