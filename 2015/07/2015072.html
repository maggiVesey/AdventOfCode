<!DOCTYPE html>
<html>
<head>
<title>Advent of Code</title>
<script>
function aocFunction(input) {

	const inputFile = input.files[0];
	const reader = new FileReader();

	reader.onload = (event) => {
		const file = event.target.result;

		const allLines = file.split(/\r\n|\n/);
		
		let result = 0
		const sources = new Map()
		const values = new Map()
		const dependencies = new Map()
		
		let start = 'a'
		let bValue = 16076

		const addDependency = (node,dependent) => {
			if(isNaN(dependent)) {
				if(!dependencies.get(node)) {
					dependencies.set(node,new Set())
				}
				dependencies.get(node).add(dependent)
			}
		}
		const getDependency = (dependent) => {
			if(!isNaN(dependent)) {
				return parseInt(dependent)
			}
			if(values.has(dependent)) {
				return values.get(dependent)
			}
		}

		allLines.forEach((line) => {
			const instructions = line.split(' ')
			let wire = instructions[instructions.length - 1]
			let instruction = instructions.slice(0,-2)
			sources.set(wire,instruction)
			
			if(wire == 'b') {
				instruction[0] = bValue
			}
			
			if(instruction.length == 3) {
				if(instruction[1] == 'AND') {
					addDependency(wire,instruction[0])
					addDependency(wire,instruction[2])
				}
				if(instruction[1] == 'OR') {
					addDependency(wire,instruction[0])
					addDependency(wire,instruction[2])
				}
				if(instruction[1] == 'LSHIFT') {
					addDependency(wire,instruction[0])
				}
				if(instruction[1] == 'RSHIFT') {
					addDependency(wire,instruction[0])
				}
			}
			else {
				if(instruction[0] == 'NOT') {
					addDependency(wire,instruction[1])
				}
				else {
					if(isNaN(instruction[0])) {
						addDependency(wire,instruction[0])
					}
					else {
						values.set(wire,parseInt(instruction[0]))
					}
				}
			}

		})
		console.log(values)
		while(dependencies.size > 0) {
			
			const remainingDependencies = [...dependencies]
			
			remainingDependencies.forEach((dependency) => {
				let thisDependency = dependency[0]
				let instruction = sources.get(thisDependency)

				if(instruction.length == 3) {
					
					let firstDependency = getDependency(instruction[0])
					let secondDependency = getDependency(instruction[2])
					
					if(firstDependency !== undefined && secondDependency !== undefined) {
						if(instruction[1] == 'AND') {
							values.set(thisDependency,firstDependency & secondDependency)
							dependencies.delete(thisDependency)
						}
						if(instruction[1] == 'OR') {
							values.set(thisDependency,firstDependency | secondDependency)
							dependencies.delete(thisDependency)
						}
						if(instruction[1] == 'LSHIFT') {
							values.set(thisDependency,firstDependency << secondDependency)
							dependencies.delete(thisDependency)
						}
						if(instruction[1] == 'RSHIFT') {
							values.set(thisDependency,firstDependency >> secondDependency)
							dependencies.delete(thisDependency)
						}
					}
				}
				else if(instruction.length == 2) {
					let firstDependency = getDependency(instruction[1])
					if (firstDependency !== undefined){
						if(instruction[0] == 'NOT') {
							values.set(thisDependency,~firstDependency)
							dependencies.delete(thisDependency)
						}
					}
				}
				else if(instruction.length == 1) {
					let firstDependency = getDependency(instruction[0])
					if (firstDependency !== undefined){
						values.set(thisDependency,firstDependency)
						dependencies.delete(thisDependency)
					}
				}
			})
		}		

		result = values.get(start)
		document.getElementById('result').value = result;
	};

	reader.onerror = (event) => {
		alert(event.target.error.name);
	};

	reader.readAsText(inputFile);
}

window.onload = function() {
	document.getElementById('file').addEventListener('change',function() {
		aocFunction(this)
	})
}

</script>
</head>
<body>
	<input type="file" name="file" id="file" accept=".txt">
	<hr />
	<label for="result">Result</label>
	<textarea id="result"></textarea>
	<div id="grid"></div>
</body>
</html>
