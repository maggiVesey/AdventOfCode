<!DOCTYPE html>
<html>
<head>
<title>Advent of Code</title>
<script>

function aocFunction(input) {

	const inputFile = input.files[0];
	const reader = new FileReader();

	reader.onload = (event) => {
		const file = event.target.result;

		const allLines = file.split(/\r\n|\n/);
		
		let result = 0
		
		allLines.forEach((line) => {
			// Regex explanation:
		    // ([a-z]{2})   → capture any two letters
		    // .*?    → match any characters lazily
		    // \1     → match the same two characters again
		    // The regex ensures no overlap because the first match consumes both letters
		    
//		    const nonOverlapping = line.match(/([a-z]{2}).*?\1/);
//		    const separatedPair = line.match(/([a-z])[a-z]\1/);
//			console.log(line,separatedPair)
			
			if((line.match(/([a-z]{2}).*?\1/) || []).length > 0 &&
				(line.match(/([a-z])[a-z]\1/) || []).length > 0) {
//				console.log(line)
				result++
			}
		});

		document.getElementById('result').value = result;
	};

	reader.onerror = (event) => {
		alert(event.target.error.name);
	};

	reader.readAsText(inputFile);
}

window.onload = function() {
	document.getElementById('file').addEventListener('change',function() {
		aocFunction(this)
	})
}

</script>
</head>
<body>
	<input type="file" name="file" id="file" accept=".txt">
	<hr />
	<label for="result">Result</label>
	<textarea id="result"></textarea>
</body>
</html>
